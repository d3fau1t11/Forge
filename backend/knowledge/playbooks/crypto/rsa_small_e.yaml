exploit_template: |
  import gmpy2
  from Crypto.Util.number import long_to_bytes

  # Given n, e=3, c
  e = 3
  c = {CIPHERTEXT}
  
  # Since m^3 < n, direct integer cube root solves plaintext
  m, exact = gmpy2.iroot(c, e)
  if exact:
      flag = long_to_bytes(int(m)).decode(errors="ignore")
      print(f"FLAG:{flag}")
notes: "Unpadded RSA with e=3 where plaintext m^e < n allows direct integer root."
